name: metabase-to-supabase-sync

on:
  schedule:
    - cron: "0 2 * * *"  # runs daily at 2:00 AM UTC — adjust to your preferred time
  workflow_dispatch: {}   # you can still trigger it manually anytime, no inputs needed

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sync script
        env:
          METABASE_URL: ${{ secrets.METABASE_URL }}
          METABASE_SESSION_TOKEN: ${{ secrets.METABASE_SESSION_TOKEN }}
          METABASE_CARD_ID: ${{ secrets.METABASE_CARD_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python sync.py
